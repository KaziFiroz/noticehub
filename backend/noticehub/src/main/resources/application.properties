# Server Configuration
server.port=${SERVER_PORT:8080}

# Database Configuration
# All values below can be overridden with environment variables.
# Never commit real credentials — set these in your shell, a local .env
# (loaded outside git), or your deployment platform's secret manager.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/noticehub_db}
spring.datasource.username=${DB_USERNAME:noticehub_user}
spring.datasource.password=${DB_PASSWORD:changeme_local_dev_only}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
# JWT_SECRET must be set as an environment variable for any shared/deployed
# environment. The fallback below is a placeholder for quick local testing
# only and is intentionally NOT a usable production secret.
jwt.secret=${JWT_SECRET:local-dev-placeholder-secret-please-override-with-env-var-256bit}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging
logging.level.com.noticehub=DEBUG
logging.level.org.springframework.security=DEBUG